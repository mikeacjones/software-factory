# Goals: a directing agent runs pipelines toward an objective. Each check is
# an acceptance line of a bead in epic E17 (sf-rzb).
id = "goals"
title = "A goal runs to its stop condition"
bead = "sf-rzb.8"

[[tool]]
name = "claude"
command = ["claude", "--version"]

[[tool]]
name = "bd"
command = ["bd", "--version"]

[[check]]
id = "definitions"
tier = "hermetic"
bead = "sf-rzb.1"
claim = "Goal definitions load side by side with one default per project, a cap below one or a misspelt key is refused, and a definition naming an unknown pipeline or a model that is not allowed is refused with the reason."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-config", "--package", "factory-driver", "--", "goal_definitions_load", "a_goal_definition_that_cannot_run"]
timeout_secs = 900

[[check]]
id = "shipped-definitions"
tier = "hermetic"
bead = "sf-rzb.1"
claim = "Every goal definition in config/ names a sound pipeline, an allowed model and prompts that exist."
command = ["cargo", "run", "--quiet", "--locked", "--offline", "--package", "factory-cli", "--", "goal", "check", "--config", "config"]
timeout_secs = 900

[[check]]
id = "decisions"
tier = "hermetic"
bead = "sf-rzb.2"
claim = "A decision to start a bead that is not launchable, is unknown or would exceed the cap is refused with the reason; completion without evidence, or with a pipeline running, is refused; a result that would leave the goal with nothing to move it is refused; and the director's briefing is the same text for the same inputs."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--lib", "goal::"]
timeout_secs = 900

[[check]]
id = "bead-writes"
tier = "hermetic"
bead = "sf-rzb.3"
claim = "Beads are listed most urgent first with whether each may be launched, and a bead is filed (deferred, typed, linked to what it was discovered from) and changed, each write read back."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-beads", "beads_are_listed_filed_and_changed"]
timeout_secs = 900

[[check]]
id = "socket"
tier = "hermetic"
bead = "sf-rzb.4"
claim = "Against a local WebSocket stand-in, the Socket Mode listener connects, acknowledges every envelope and delivers owner messages and button presses, and drops bot messages, edits and noise."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-slack", "socket::"]
timeout_secs = 900

[[check]]
id = "goal-run"
tier = "hermetic"
bead = "sf-rzb.5"
claim = "With a scripted director and a real pipeline against scripted stand-ins: only the owner's top-level message opens a goal; the opening conversation is one session and nothing is written or run before Start; each wake is a fresh session that gets the journal and the project memory; a refused decision goes back to the same session; a pipeline ending wakes the director with its unfixed findings, which it files or drops; a change to an existing bead waits for the owner's approval; and Accept ends the goal with no agent, after a restart."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "walk", "a_goal_is_agreed_run_on_events_and_ended_by_the_owner"]
timeout_secs = 900

[[check]]
id = "service"
tier = "hermetic"
bead = "sf-rzb.5"
claim = "A release holds a build beside a copy of its config and becomes current in one step, with the one in use kept; the launchd job runs the current release, in the desktop session only, at login and whenever it exits; a run left behind by a process that died is found by its process ID and start time and killed with what it started, and a process that merely has that ID is not. Asked to stop at a safe point, with real pipelines: a pipeline about to start stops before its first step and stays the goal's running pipeline; no agent is woken while the service is stopping; what the owner writes meanwhile is kept and handled by the next service; and across two restarts every step of the pipeline runs exactly once."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--package", "factory-supervise", "--", "a_release_holds_a_build", "the_launchd_job_runs", "a_jobs_state_is_read", "what_a_dead_process_left", "the_service_stops_at_a_safe_point"]
timeout_secs = 900

[[check]]
id = "service-live"
tier = "owner"
bead = "sf-rzb.5"
claim = "On this machine launchd is running the factory service from a release."
command = ["cargo", "run", "--quiet", "--locked", "--package", "factory-cli", "--", "service", "status", "--config", "config"]
timeout_secs = 300

[[check]]
id = "sub-goals"
tier = "hermetic"
bead = "sf-rzb.12"
claim = "A bead in a sub-goal branches from the sub-goal's tip and is absorbed as one commit, with no pull request and its bead left open; a bead blocked only by absorbed beads may be started; shipping runs the heavy pipeline once, opens one pull request holding a commit per bead, squashes it onto the default branch and closes every bead; and the director cannot start a bead outside an open sub-goal, open two at once, ship an empty one, or call the goal complete with absorbed work unshipped."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--package", "factory-beads", "--", "a_sub_goal_absorbs", "a_bead_runs_inside_a_sub_goal", "a_sub_goal_ships_when", "the_brief_shows_each_sub_goal", "beads_are_listed_filed_and_changed"]
timeout_secs = 900

[[check]]
id = "issues"
tier = "hermetic"
bead = "sf-rzb.15"
claim = "A bead with no GitHub issue gets one, linked in the tracker, when its pipeline starts; the publisher is told the issues to close; a pull-request body that leaves one out is refused; a sub-goal's pull request closes the issue of every bead it absorbed; and no issue is created in a repository outside the write list."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--package", "factory-github", "--package", "factory-beads", "--", "a_sub_goal_absorbs", "an_issue_is_closed_only", "an_issue_outside_the_write_list", "beads_are_listed_filed_and_changed"]
timeout_secs = 900

[[check]]
id = "issue-fields"
tier = "hermetic"
bead = "sf-rzb.17"
claim = "An issue gets the repository's own issue type and priority option beside its labels: both are found by name and set by ID, what already agrees is left alone, each is set whether or not the other can be, a name the repository lacks is an error that says what it has, and nothing is set in a repository outside the write list. A bead's issue gets them when the pipeline that starts work on it creates the issue."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-github", "--package", "factory-driver", "--", "an_issue_gets_the_repositorys_own_type", "an_issues_fields_are_not_set_outside", "a_sub_goal_absorbs"]
timeout_secs = 900

[[check]]
id = "issue-fields-live"
tier = "owner"
bead = "sf-rzb.17"
claim = "On temporal-sdk-zig, every open bead that has a GitHub issue has that issue's type and Priority field in step with the bead."
command = ["cargo", "run", "--quiet", "--locked", "--package", "factory-cli", "--", "issues", "sync", "temporal-sdk-zig", "--config", "config"]
timeout_secs = 900

[[check]]
id = "branch-sync"
tier = "hermetic"
bead = "sf-rzb.19"
claim = "For a project that keeps its branches on the remote: a builder's commit is on the remote while the builder is still at work; what the factory itself commits is pushed when the step ends; when a bead is absorbed its sub-goal's branch is pushed and only then is the bead's branch removed from the remote, leaving the sub-goal's branch as the factory's only one there; and publishing still leaves the bead as one commit. Once a unit's branch has a pull request, only publishing moves it: a commit made while a failed check is being fixed goes to a holding branch, `wip/<branch>`, which is removed from the remote as soon as the fix is published."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "walk", "--", "a_units_branch_is_on_the_remote", "an_absorbed_beads_branch", "work_in_hand_on_a_branch"]
timeout_secs = 900

[[check]]
id = "queue"
tier = "hermetic"
bead = "sf-rzb.16"
claim = "A goal started while its project is at its limit of running goals is queued and runs no director; it stays queued across a restart; when a running goal ends the longest-waiting one starts by itself; a project that allows two runs two; and two goals opened in the same second get different IDs."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "walk", "a_goal_started_while_another_runs"]
timeout_secs = 900

[[check]]
id = "accounts"
tier = "hermetic"
bead = "sf-rzb.9"
claim = "Among usable accounts the one whose week resets soonest is chosen, then the one whose five-hour session does, and one with no window open is kept for later; an account at its session or weekly limit is skipped until the reset; a limit on one model leaves the account usable for others; with every account at a limit the choice is to wait for the earliest reset; a run refused at a limit continues its session under another account; and no token reaches a log or the state file."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-claude", "--package", "factory-driver", "--", "accounts::", "a_run_refused_at_a_limit"]
timeout_secs = 900

[[check]]
id = "account-logins"
tier = "hermetic"
bead = "sf-rzb.18"
claim = "Against stand-in endpoints: the refresh lock is the pair of directories Claude Code keeps, it is not taken while Claude Code holds either, and one abandoned for over a minute is taken over; an expired login is refreshed with Claude Code's own request under that lock and written back with everything else kept; a login refreshed meanwhile, or one whose lock is held, is left untouched; a refused refresh changes nothing; a login not seen before is asked whose it is, and one that has become another account's is refused before its usage is read; and a weekly window that moves, or two accounts that are one subscription, are reported."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-claude", "--package", "factory-config", "--", "the_refresh_lock_is_the_one", "an_expired_login_is_refreshed", "a_login_someone_else_refreshed", "a_refused_refresh_changes_nothing", "a_login_that_has_become_another", "a_week_that_moves", "an_account_that_refreshes"]
timeout_secs = 900

[[check]]
id = "accounts-live"
tier = "owner"
bead = "sf-rzb.9"
claim = "With the owner's two accounts, the factory reads each one's windows without a model call, refreshing a login that is about to expire, and names the account a run would use."
command = ["cargo", "run", "--quiet", "--locked", "--package", "factory-cli", "--", "accounts", "--config", "config"]
timeout_secs = 300

[[check]]
id = "socket-live"
tier = "owner"
bead = "sf-rzb.4"
claim = "With the owner's Slack app, the socket connects and the factory finds the channels of the projects that have goals."
command = ["cargo", "run", "--quiet", "--locked", "--package", "factory-cli", "--", "slack", "check", "--config", "config"]
timeout_secs = 300

[[check]]
id = "zig-goal"
tier = "owner"
bead = "sf-rzb.8"
claim = "A goal on temporal-sdk-zig was opened from a Slack message, started by the owner, landed at least one bead, and was accepted as complete by the owner."
command = ["proofs/goal_zig_verify.sh"]
timeout_secs = 300
