# Tiers: an Executive, Directors and Foremen run work in parallel where it is
# safe. Each check is an acceptance line of a bead in epic E18 (sf-7nv). The
# stages land bottom-up, and each adds its checks here.
id = "tiers"
title = "A goal runs under every tier, with work side by side"
bead = "sf-7nv.5"

[[tool]]
name = "claude"
command = ["claude", "--version"]

[[tool]]
name = "jq"
command = ["jq", "--version"]

[[check]]
id = "tier-definitions"
tier = "hermetic"
bead = "sf-7nv.1"
claim = "A goal definition may give its sub-goals a foreman, a tier of the same shape as the director; a foreman without sub-goals to run, or a tier asked to run work side by side before that is built, is refused; and every goal definition in config/ names allowed models and prompts that exist for each tier."
command = ["sh", "-c", "cargo test --locked --offline --package factory-config goal_definitions_load && cargo run --quiet --locked --offline --package factory-cli -- goal check --config config"]
timeout_secs = 900

[[check]]
id = "foreman-decisions"
tier = "hermetic"
bead = "sf-7nv.1"
claim = "A foreman may start only launchable beads of its own sub-goal, within its slots; it is never left idle, since a result with nothing running and nothing reported is refused; ready needs absorbed work, nothing running and a word to the director. A director whose sub-goals have foremen cannot start beads, must move the goal itself once a foreman waits, and is cut off from an exchange with a foreman that starts nothing. Each is briefed on the other with the same text for the same inputs."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--lib", "--", "a_director_with_foremen", "a_foreman_starts_its_own_beads", "each_tier_is_briefed"]
timeout_secs = 900

[[check]]
id = "foreman-run"
tier = "hermetic"
bead = "sf-7nv.1"
claim = "With scripted agents and real pipelines against scripted stand-ins: opening a sub-goal wakes its foreman; the foreman's escalation wakes the director and the answer wakes the foreman; the foreman starts each bead in turn, files a finding as a bead that joins the sub-goal and runs there, and reports ready; no bead's end wakes the director, which runs only to plan, to answer and to ship; and the sub-goal lands as one pull request that closes every bead. A foreman that cannot run is retried, survives restarts with the event it was owed, and after five failures hands its sub-goal to the director."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "walk", "a_foreman_"]
timeout_secs = 900

[[check]]
id = "side-by-side-rules"
tier = "hermetic"
bead = "sf-7nv.2"
claim = "A foreman may start beads together only within its slots, only when every bead that would run at once has declared plain paths inside the repository, and only when no two declarations overlap, a directory counting as everything under it; a bead running with no paths keeps everything else waiting; and a bead that runs alone needs none. A foreman's slots may not exceed the pipelines the goal allows."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--package", "factory-config", "--", "beads_run_side_by_side_only", "goal_definitions_load"]
timeout_secs = 900

[[check]]
id = "merge"
tier = "hermetic"
bead = "sf-7nv.2"
claim = "Merging another branch into a unit's is clean when the two changed different files; when they changed the same lines the merge is committed with its conflict markers, the worktree is left clean, the conflicted files are named, and a file counts as resolved once it holds no marker."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-git", "a_branch_takes_in_another"]
timeout_secs = 900

[[check]]
id = "side-by-side-run"
tier = "hermetic"
bead = "sf-7nv.2"
claim = "With scripted agents and real pipelines: two beads started by one decision are built at the same time in worktrees of their own; the second to finish has the first merged into it, the project's checks run again with no agent, and it is absorbed onto the first, leaving one commit for each in a line; a bead that changed files outside its declared paths is reported to the foreman. When the two changed the same file, the conflict goes to the second bead's builder in its own session, an answer that leaves markers in is refused by code, and after the fix the whole pipeline runs again before it is absorbed."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "walk", "two_beads_"]
timeout_secs = 900

[[check]]
id = "sub-goal-rules"
tier = "hermetic"
bead = "sf-7nv.3"
claim = "A director may have as many sub-goals not yet landed as it has slots, and more than one only when each has declared paths and no two overlap; a sub-goal in flight with no paths keeps others from opening; sub-goals are shipped and their foremen answered by name; one waiting in line to ship counts as moving and cannot be shipped again; and a bead's paths must lie inside its sub-goal's. A director's slots above one need a foreman, and a ship pipeline that takes in the default branch first."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--package", "factory-config", "--", "sub_goals_are_worked_on_side_by_side", "goal_definitions_load"]
timeout_secs = 900

[[check]]
id = "sub-goal-run"
tier = "hermetic"
bead = "sf-7nv.3"
claim = "With scripted agents and real pipelines against a scripted GitHub: two sub-goals are opened by one decision, each with its own foreman and its bead built at the same time as the other's; shipped together, one ships while the other waits in line; the second starts when the first has landed, merges the default branch in before anything is verified, and lands as a second squashed commit. When the two changed the same file, the conflict goes to a builder on the second sub-goal's branch, an answer that leaves markers in is refused, and nothing is pushed until they are gone."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "walk", "--", "two_sub_goals_worked_on", "a_sub_goal_that_collides"]
timeout_secs = 900

[[check]]
id = "zig-sub-goals"
tier = "owner"
bead = "sf-7nv.3"
claim = "On temporal-sdk-zig, a director had two sub-goals of a real goal in flight at once, and both landed, the second after taking in the first."
command = ["proofs/tiers_zig_verify.sh", "--sub-goals"]
timeout_secs = 300

[[check]]
id = "zig-side-by-side"
tier = "owner"
bead = "sf-7nv.2"
claim = "On temporal-sdk-zig, a foreman ran two beads of a real sub-goal at the same time, both were absorbed, and the sub-goal landed."
command = ["proofs/tiers_zig_verify.sh", "--side-by-side"]
timeout_secs = 300

[[check]]
id = "zig-foreman"
tier = "owner"
bead = "sf-7nv.1"
claim = "On temporal-sdk-zig, a sub-goal of a real goal was run by a foreman from its first bead to ready, shipped by the director, and landed."
command = ["proofs/tiers_zig_verify.sh"]
timeout_secs = 300
