# Temporal: the factory's orchestration on a flow-engine workflow. Each check
# is an acceptance line of a bead in epic E19 (sf-9a0).
id = "temporal"
title = "The factory runs on Temporal"
bead = "sf-9a0"

[[tool]]
name = "temporal"
command = ["temporal", "--version"]

[[check]]
id = "cut-off-runs"
tier = "hermetic"
bead = "sf-9a0.1"
claim = "A run's session ID is on disk from the first line the CLI prints, and a step whose run was cut off resumes that session with a carry-on prompt and no new briefing."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-claude", "--package", "factory-driver", "--", "a_runs_session_is_written", "a_run_cut_off_by_the_death"]
timeout_secs = 900

[[check]]
id = "engine-spike"
tier = "host"
bead = "sf-9a0.2"
claim = "Against a Temporal server started on this machine, with the Rust SDK 1.2.0: one engine workflow runs two different flow definitions given to it as data; a pipeline that parks waits with nothing running and is continued by a signal, from a step and with a note; a step whose worker is killed is given to the next worker, which resumes the session the first run reported; a usage limit is waited out on a server timer with no worker up, and the step then resumes its session; and with two versioned builds of the worker, a pipeline finishes on the build that started it while new pipelines start on the new one."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-engine", "--test", "spike", "--", "--test-threads=1"]
timeout_secs = 900

[[check]]
id = "engine-pipeline"
tier = "host"
bead = "sf-9a0.4"
claim = "With the factory's own driver doing every step, on a real repository with a scripted Claude, and the engine on a Temporal server started on this machine walking the flow: a bead is prepared, built, broken once by the tester, fixed in the builder's session, reviewed and published, with the unit's record and log kept as the driver keeps them; and a pipeline whose builder needs the owner parks, in the workflow and in the unit's record, and goes on from a decision whose note reaches the builder; and with two accounts and the accounts workflow handing them out, a run the first account refuses at a limit carries on in its session under the second, whose token the driver reads itself and no history holds; and a bead the driver will not start on ends its pipeline at once, having asked the driver once, and the pipeline says why to whoever asks."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-engine", "--test", "pipeline", "--", "--test-threads=1"]
timeout_secs = 900

[[check]]
id = "drain-keeps-long-steps"
tier = "host"
bead = "sf-9a0.17"
claim = "On a Temporal server started on this machine, a worker asked to stop at a safe point while an agent step runs goes on heartbeating it: a build that runs more than six heartbeat timeouts past the drain completes on that worker as attempt 1, with nothing in the pipeline's history timed out, the worker leaves by itself with status 0 once the build has ended, and the worker that starts next goes on from the step after it without running the build again. Separately, a step asked for again after its first attempt already wrote its `step.ended` for the same round hands back that outcome without running the step again or parking the unit."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-engine", "--package", "factory-driver", "--", "--test-threads=1", "a_long_agent_step_finishes_on_a_draining_worker_as_its_first_attempt", "a_step_asked_for_again_after_it_ended_hands_back_its_outcome_without_running"]
timeout_secs = 900

[[check]]
id = "accounts-workflow"
tier = "host"
bead = "sf-9a0.3"
claim = "With stand-in accounts, on a Temporal server started on this machine: of three accounts the one whose week ends soonest is handed out and one at a limit is passed over; a run stopped by a limit reports it and is handed the next account, in the same session, with no new check of the accounts; a pipeline asking when every account is at a limit waits with no worker up, and is released by the limit ending, by a re-check signal that finds an account back, and after the accounts workflow has continued as new; and no account's token is in the history of the accounts workflow or of any pipeline, searched inside the payloads."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-engine", "--test", "accounts", "--", "--test-threads=1"]
timeout_secs = 900

[[check]]
id = "engine-goal-pipelines"
tier = "host"
bead = "sf-9a0.8"
claim = "With `pipelines = true` in the factory's [temporal] table, a goal's pipelines are workflows: the service's own supervisor, with a scripted director, opens a sub-goal, and the bead it starts there runs on the engine inside the sub-goal and is absorbed, and the sub-goal is shipped on the engine as one pull request and merged, with nothing run on a thread of the service and each pipeline found on the server under the name the goal's record gives it. A pipeline run for a goal ends where it parks and says why; another takes the unit up from the factory's record, from a named step with a note that reaches that step and a ruling that reaches a later one, or exactly where it stands with nothing counted twice."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-engine", "--test", "pipeline", "--", "--test-threads=1", "a_goals_bead_and_its_sub_goals_shipping", "a_pipeline_run_for_a_goal_ends_where_it_parks", "a_unit_is_taken_up_where_it_stands"]
timeout_secs = 900

[[check]]
id = "engine-tiers"
tier = "host"
bead = "sf-9a0.9"
claim = "With `tiers = true` in the factory's [temporal] table no supervisor runs anywhere: the engine's worker sees that the project's workflow and the intake are running, and a goal is opened, started by the owner's button, worked in a sub-goal, shipped as one merged pull request and proposed complete through signals to the project's workflow alone, each dealt with as one turn, an activity. The pipelines a turn asks for are child workflows named from the goal's record, and the project hears that each has its unit and has ended from the watcher. The project's workflow, the intake and both pipelines say of everything they started what it is for, and nothing in the project's history stands as failed or timed out. Asked to stop at a safe point, the worker leaves by itself with status 0, though its listener and watcher never end otherwise."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-engine", "--test", "pipeline", "--", "--test-threads=1", "a_goal_runs_from_its_opening_to_its_end_with_its_tiers_on_the_engine"]
timeout_secs = 900

[[check]]
id = "engine-owner-message-kept"
tier = "host"
bead = "sf-9a0.10"
claim = "What the owner writes to a project's executive while every account is at its usage limit is neither dropped nor to be written again: the turn ends with nobody asked and the message on record once, the project's workflow keeps it and waits on a timer with nothing running, the worker is killed and another started while it waits, and when the account is back the executive is asked once and its answer is on record after the one message."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-engine", "--test", "pipeline", "--", "--test-threads=1", "what_the_owner_writes_while_no_account_is_free_is_answered_when_one_is"]
timeout_secs = 900

[[check]]
id = "engine-described"
tier = "host"
bead = "sf-9a0.6"
claim = "Someone reading a workflow on the Temporal server is told what everything in it is for: a pipeline and the accounts workflow are started with a summary and details of their own, and every activity, timer and signal they start carries a one-line summary naming the step and what it is run on. A history with one that says nothing fails the tests, in a pipeline that waited for an account and was released, one that parked and went on, one that waited out a limit, and the accounts workflow that served them."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-engine", "--", "--test-threads=1", "a_pipeline_waits_for_an_account_with_nothing_running", "accounts_are_handed_out_by_the_rule", "a_parked_pipeline_waits", "a_usage_limit_is_waited_out", "describe::"]
timeout_secs = 900

[[check]]
id = "issue-sweep"
tier = "hermetic"
bead = "sf-9a0.18"
claim = "A sweep of a project that keeps GitHub issues gives each open bead without an issue exactly one, made and labelled as the factory makes one, and records it on the bead; it leaves a bead filed less than the minimum age ago and one the factory's own actor has claimed, sets type and priority on a bead that has an issue, makes no second issue when run again, and does nothing for a project that keeps no issues. A bead source can say how long ago each bead was filed."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--package", "factory-beads", "--", "the_issue_sweep_gives_each_open_bead_one_issue", "a_bead_just_filed_is_young"]
timeout_secs = 900

[[check]]
id = "never-started-is-checked"
tier = "hermetic"
bead = "sf-9a0.19"
claim = "Only the watcher's own report that a pipeline never started names a pipeline for the turn to ask the server about before the goal is told; a pipeline that failed for a reason of its own, ended or was refused is handed on without asking. The asking itself is proved on a server by `never-started-asks-the-server`."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-engine", "--lib", "--", "only_the_watchers_own_report_is_checked_against_the_server"]
timeout_secs = 600

[[check]]
id = "never-started-asks-the-server"
tier = "host"
bead = "sf-9a0.19"
claim = "With the tiers on the engine and a goal's bead pipeline running on a Temporal server started on this machine, the watcher's report that the pipeline never started, handed to the project's workflow, leaves the goal's record as it was: the unit still running, nothing in the goal's inbox, no failure counted, and the director not woken. The same report of a pipeline the server does not know is handed to the goal as before, and its unit is recorded as failed with the watcher's words."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-engine", "--test", "pipeline", "--", "--test-threads=1", "a_goal_is_not_told_that_a_pipeline_the_server_knows_never_started"]
timeout_secs = 900

[[check]]
id = "issue-schedule"
tier = "host"
bead = "sf-9a0.18"
claim = "On a Temporal server started on this machine, the schedule the worker keeps for a project starts the sweep workflow on its interval, whose run and activity say what they are for and whose result is the sweep's; made again with the same settings it is left as it is, and with another interval it is replaced; a sweep slower than the interval has the runs it would overlap skipped; and a sweep in which a bead failed fails its run, naming the bead."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-engine", "--test", "issues", "--", "--test-threads=1"]
timeout_secs = 900

[[check]]
id = "engine-live"
tier = "owner"
bead = "sf-9a0.4"
claim = "The owner's Temporal server answers this machine in the factory's namespace."
command = ["temporal", "operator", "namespace", "describe", "--address", "192.168.101.240:7233", "--namespace", "software-factory"]
timeout_secs = 60

