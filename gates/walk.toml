# The first milestone: one real bead walked to a pull request. Each check is
# an acceptance line of a bead in epic E16 (sf-c9e).
id = "walk"
title = "One real bead reaches a pull request"
bead = "sf-c9e.9"

[[tool]]
name = "claude"
command = ["claude", "--version"]

[[tool]]
name = "bd"
command = ["bd", "--version"]

[[tool]]
name = "gh"
command = ["gh", "--version"]

[[check]]
id = "flow"
tier = "hermetic"
bead = "sf-c9e.1"
claim = "A flow with an unrouted outcome, an unknown target or an unbounded backward route is refused with the reason, a scripted unit walks every step with no model, and a saved position is restored."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-flow", "--package", "factory-config"]
timeout_secs = 900

[[check]]
id = "shipped-flows"
tier = "hermetic"
bead = "sf-c9e.1"
claim = "The flow the Zig project names is sound against its project record and the role registry."
command = ["cargo", "run", "--quiet", "--locked", "--offline", "--package", "factory-cli", "--", "flow", "check", "temporal-sdk-zig", "--config", "config"]
timeout_secs = 900

[[check]]
id = "claude-adapter"
tier = "hermetic"
bead = "sf-c9e.2"
claim = "Recorded stream output from the pinned CLI parses into an outcome, session, typed result and usage; a run refused at the limit is Limited whatever its subtype says; the command line is headless, bypass mode and never bare."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-claude", "--package", "factory-supervise"]
timeout_secs = 900

[[check]]
id = "work-sources"
tier = "hermetic"
bead = "sf-c9e.3"
claim = "A claimed, closed, blocked or criteria-less bead is refused with the reason; a step's changes outside its path scopes are reported; a failing command is told apart from one that could not run or timed out; checkpoints squash to one commit with the same content."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-beads", "--package", "factory-git", "--package", "factory-checks"]
timeout_secs = 900

[[check]]
id = "slack-thread"
tier = "hermetic"
bead = "sf-c9e.4"
claim = "Against a stand-in for Slack: a missing channel is created and the owner invited, owner replies are heard once each and strangers never, and with Slack unreachable the run carries on with the failure in its event log."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-slack", "--package", "factory-driver", "--test", "slack", "--lib"]
timeout_secs = 900

[[check]]
id = "contracts"
tier = "hermetic"
bead = "sf-c9e.5"
claim = "A briefing is the same bytes for the same inputs, each step's schema allows exactly the outcomes its flow routes, and a tester finding without a reproduction is rejected by code."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-brief"]
timeout_secs = 900

[[check]]
id = "publish"
tier = "hermetic"
bead = "sf-c9e.6"
claim = "A write to a repository outside the project's write list is refused, publication text with a mention or a reference to another repository is refused, and publishing twice yields one pull request."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-github"]
timeout_secs = 900

[[check]]
id = "unit-walk"
tier = "hermetic"
bead = "sf-c9e.7"
claim = "With a scripted stand-in for the CLI, a unit is built, broken by the tester, fixed, held, reviewed and published as one commit; its event log names every step and its usage adds up; a parked unit continues from the step it stopped at."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "walk"]
timeout_secs = 900

[[check]]
id = "config-tools"
tier = "hermetic"
bead = "sf-asl"
claim = "A project command may be a tool kept in the factory's config directory, named with `{config}` in its argv: it is run from there, the thread shows the name the project gives it and not its path, and a builder it fails for is given the command as it can be typed."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "walk", "a_command_can_be_a_tool"]
timeout_secs = 900

[[check]]
id = "ci-and-landing"
tier = "hermetic"
bead = "sf-c9e.11"
claim = "Against a scripted GitHub: a failed check ends the wait and its log reaches the builder's session, at once when nothing else is running, and otherwise once the checks still running have finished or been waited for long enough, with every failure and its log handed back together for one round of fixing, and with the project's own note on how to reproduce such a failure on this machine; green needs every required check present and passed; nothing merges unless the head is the commit the factory published; the bead is closed only after the merge commit is on the default branch; a conflicting pull request parks the unit; an ended unit can be moved onto the current flow by the owner; and a project that names squash lands as one single-parent commit whose message has the change's body, a Testing paragraph and its trailers."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--package", "factory-github", "--", "a_red_check", "a_failing_ci_run", "a_red_verdict", "a_pull_request_that_conflicts", "a_push_by_someone_else", "the_owner_can_put", "one_failed_check", "green_needs", "check_runs_and", "a_merge_outside", "a_project_can_land_by_squashing", "a_commit_message_splits"]
timeout_secs = 900

[[check]]
id = "report-artifacts"
tier = "hermetic"
bead = "sf-c9e.12"
claim = "A flow whose step needs an artifact that is missing or stale on some path is refused with the step and artifact named; a report command gets its output directory from the factory, outside the worktree, and the steps that need it are briefed with its location and index; the merge commit carries the summary, a Testing line and the project's trailer."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-flow", "--package", "factory-driver", "--", "a_step_may_need", "a_needed_artifact", "only_commands_produce", "a_red_check", "prose_is_wrapped"]
timeout_secs = 900

[[check]]
id = "proofs"
tier = "hermetic"
bead = "sf-rzb.14"
claim = "A finding whose reproduction passes when the factory runs it is sent back to the tester; an accepted finding's regression test joins the branch and is published; a fix that leaves it failing is sent back to the builder; a fresh tester is told what earlier rounds found; a report line named in fail_when sends the change to the fix step; a step limited to path scopes is skipped when the change touches none; removed test lines are pointed out; and a step's effort can rise by round."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--package", "factory-checks", "--package", "factory-flow", "--", "a_finding_is_proved", "a_unit_is_built_broken_fixed", "a_report_line_that_must_not_pass", "a_sub_goal_absorbs", "removed_test_lines", "a_summary_line_that_must_never_pass", "a_command_can_depend_on_what_changed"]
timeout_secs = 900

[[check]]
id = "scratch-walk-live"
tier = "live"
bead = "sf-c9e.7"
claim = "With the real CLI on Haiku, a scratch-project bead goes through the whole flow and ends as one pushed commit that passes the project's test and does what the bead asked."
command = ["proofs/walk_scratch.sh"]
timeout_secs = 2400

[[check]]
id = "zig-run"
tier = "owner"
bead = "sf-c9e.8"
claim = "A factory unit for temporal-sdk-zig ended with a pull request into main from a factory branch that is open or merged on GitHub, its Slack thread has every step, and its bead is claimed by the factory, or closed once the pull request has merged."
command = ["proofs/walk_zig_verify.sh"]
timeout_secs = 300
