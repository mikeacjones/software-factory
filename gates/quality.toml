# Quality around the pipeline: what testers find is counted and told to the
# next builder, a command proves that new tests test the change, and the
# reviewer judges idiom and quality against a text. Each check is an
# acceptance line of a bead in epic E20 (sf-gl5). The beads land in order,
# and each adds its checks here.
id = "quality"
title = "Defects become checks, and code proves what a model was asked to judge"

[[tool]]
name = "git"
command = ["git", "--version"]

[[tool]]
name = "python3"
command = ["python3", "--version"]

[[check]]
id = "finding-class-contract"
tier = "hermetic"
bead = "sf-gl5.1"
claim = "A tester's result with a critical or major finding that has no category, or one not written as a key, is rejected by code, and the classes are listed most frequent first or not at all."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-brief"]
timeout_secs = 900

[[check]]
id = "finding-classes-in-briefs"
tier = "hermetic"
bead = "sf-gl5.1"
claim = "A builder's first brief on a project with recorded findings lists the most frequent classes and a tester's lists the keys to reuse; neither has the section while nothing is recorded; findings of another project and records that cannot be read are left out."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "walk", "--", "a_builder_is_told_the_classes", "a_unit_is_built_broken_fixed"]
timeout_secs = 900

[[check]]
id = "finding-class-role"
tier = "hermetic"
bead = "sf-gl5.1"
claim = "The tester's role says how to choose a finding's class and to reuse a key the brief lists."
command = ["grep", "-q", "reuse a key the brief lists", "config/roles/tester.md"]
timeout_secs = 30

[[check]]
id = "findings-command"
tier = "host"
bead = "sf-gl5.1"
claim = "`factory findings <project>` prints each class of the project's recorded findings with how many findings and beads it has."
command = ["cargo", "run", "--quiet", "--locked", "--offline", "--package", "factory-cli", "--", "findings", "temporal-sdk-zig", "--config", "config"]
timeout_secs = 900

[[check]]
id = "proof-step-in-flows"
tier = "hermetic"
bead = "sf-gl5.2"
claim = "The Zig project's flows name the proof step before the tester and are sound against the project's record; a step that needs an artifact is refused when a step that changes the code can come between."
command = ["sh", "-c", "cargo test --locked --offline --package factory-flow && cargo run --quiet --locked --offline --package factory-cli -- flow check temporal-sdk-zig --config config && cargo run --quiet --locked --offline --package factory-cli -- goal check --config config && grep -q 'on.pass = \"proof\"' config/flows/zig-sdk-bead.toml config/flows/zig-sdk.toml"]
timeout_secs = 900

[[check]]
id = "proof-routes"
tier = "hermetic"
bead = "sf-gl5.2"
claim = "A unit whose new test passes at the base goes back to the builder with the test named, before any tester runs; one whose tests fail there goes on; a test that does not build there goes on, and the record and the tester's and reviewer's briefs say so."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "walk", "--", "a_new_test_that_passes_without_the_change"]
timeout_secs = 900

[[check]]
id = "zig-test-blocks"
tier = "hermetic"
bead = "sf-gl5.2"
claim = "The Zig project's tool splits a change at test blocks, runs each new test alone on the code as it was, and classes it: fails, does not build, passes, skipped, not reached, not judged; it lists removed tests and leaves the worktree as it was."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "test_proof"]
timeout_secs = 900

[[check]]
id = "reviewer-remit"
tier = "hermetic"
bead = "sf-gl5.2"
claim = "The reviewer's role no longer asks whether tests fail without the change, and says what idiom and quality are judged against; a builder and a reviewer are named the project's standards."
command = ["sh", "-c", "! grep -q 'must fail without the change' config/roles/reviewer.md && grep -q 'written standards' config/roles/reviewer.md && cargo test --locked --offline --package factory-driver --lib -- a_builder_and_a_reviewer_are_named"]
timeout_secs = 900

[[check]]
id = "stop-check"
tier = "hermetic"
bead = "sf-gl5.4"
claim = "A goal definition may name a stop_check command, and one that is not a command of the project is refused; the command runs on the default branch when it has moved; a director's complete is refused while it fails, with what it said in the brief; once it passes the proposal reaches the owner."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--lib", "--test", "walk", "--", "a_goal_with_a_stop_check_is_complete_only", "a_goal_is_not_proposed_as_complete_while"]
timeout_secs = 900

[[check]]
id = "designer-contract"
tier = "hermetic"
bead = "sf-gl5.5"
claim = "A design orders every bead of its sub-goal once or says the split is wrong; the director is shown a design that waits and may accept it or send it back with a note, three times at most; code refuses a start or a ship in a sub-goal whose design is not accepted, and a turn that leaves a waiting design unruled."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--lib", "--", "a_design_orders_every_bead", "nothing_starts_or_ships_in_a_sub_goal_before"]
timeout_secs = 900

[[check]]
id = "designer-runs-first"
tier = "hermetic"
bead = "sf-gl5.5"
claim = "A goal definition may name a designer, and only with a ship_flow; a sub-goal opened under it is designed before its foreman is woken; a designer's objection to the split reaches the director, whose note reaches the designer; the accepted design is in the first brief of the foreman and of the builder, the tester and the reviewer of the sub-goal's bead."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "walk", "--", "a_sub_goal_is_designed_and_the_design_accepted"]
timeout_secs = 900

[[check]]
id = "designer-configured"
tier = "hermetic"
bead = "sf-gl5.5"
claim = "The Zig project's goal definition has a designer whose model is allowed and whose role prompt exists."
command = ["sh", "-c", "cargo run --quiet --locked --offline --package factory-cli -- goal check --config config | grep -q 'designer claude-'"]
timeout_secs = 900

[[check]]
id = "schedule-contract"
tier = "hermetic"
bead = "sf-gl5.6"
claim = "A schedule is due at its hour every so many days and a missed time is made up once; a maintenance run may file beads up to its limit, each with acceptance criteria, and code refuses a result that starts, continues, ships, closes, edits or completes anything; the measures a run is shown are computed from the units' records since the last run and are the same for the same records; the brief says what the default branch's own CI said and on which commit, and holds what each report command printed."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--lib", "--", "a_schedule_is_due", "a_maintenance_run"]
timeout_secs = 900

[[check]]
id = "schedule-runs"
tier = "hermetic"
bead = "sf-gl5.6"
claim = "A definition with a schedule cannot be the default or have a stop check, and a report it names must be a command of the project; seen first it counts from now; overdue, it is run once: the maintainer is shown the charter, the limit, the finding classes, the default branch's CI as passed and later as failed with the run, the output of a report command that failed, and the tracker, a result that asks for a pipeline or too many beads goes back to the same session, the bead it files is in the tracker, no goal or unit is made, the digest is posted, and the next run is given its journal."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "walk", "--", "a_scheduled_definition_is_run_when_due"]
timeout_secs = 900

[[check]]
id = "schedule-configured"
tier = "hermetic"
bead = "sf-gl5.6"
claim = "The Zig project has a scheduled definition whose maintainer's model is allowed and whose role prompt exists."
command = ["sh", "-c", "cargo run --quiet --locked --offline --package factory-cli -- goal check --config config | grep -q 'temporal-sdk-zig/upkeep: scheduled, maintainer claude-'"]
timeout_secs = 900

[[check]]
id = "maintenance-build-contract"
tier = "hermetic"
bead = "sf-gl5.9"
claim = "A maintenance run's mark to build is refused when its schedule names no definition to build under and while the goal of an earlier run is still building, and filing alone is always allowed; a bead to build cannot be deferred, a bead named to build must be one an earlier run filed that still waits, the paths must be plain, and the goal's director must be given a plan."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--lib", "--", "a_maintenance_run_has_beads_built_only_when"]
timeout_secs = 900

[[check]]
id = "maintenance-builds"
tier = "hermetic"
bead = "sf-gl5.9"
claim = "With a scripted maintainer and director and a real pipeline: a schedule that builds under a scheduled or unknown definition is refused; a bead a run filed and did not build is shown to the next run, which has it built; the factory opens one goal under the named definition whose charter names the bead, the plan and the paths, with no opening conversation and no Start, and its director is woken at once and told how the goal came to be; while that goal builds, a run that marks a bead is refused and may file; and when the bead has landed and is closed the goal is complete with no director run and no owner action, after which a run may build again."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "walk", "--", "a_maintenance_run_builds_what_it_marks"]
timeout_secs = 900

[[check]]
id = "class-calls-a-run"
tier = "hermetic"
bead = "sf-gl5.10"
claim = "A class of defect that has broken as many beads as the schedule says since a run was last shown it makes a run due at once, the run's brief names the class, and what the run was shown is kept so that the class calls no second run until it has broken that many beads more."
command = ["sh", "-c", "cargo test --locked --offline --package factory-driver --lib -- a_class_calls_a_run && cargo test --locked --offline --package factory-driver --test walk -- a_maintenance_run_builds_what_it_marks"]
timeout_secs = 900

[[check]]
id = "maintenance-builds-configured"
tier = "hermetic"
bead = "sf-gl5.9"
claim = "The Zig project's scheduled definition builds what its runs mark under the project's goal definition, is called by a class of defect that keeps breaking beads, and its maintainer's role says to build tools that every later change runs."
command = ["sh", "-c", "cargo run --quiet --locked --offline --package factory-cli -- goal check --config config | grep -q 'temporal-sdk-zig/upkeep: scheduled, .* builds what it marks under `parity`, called at once when a class of defect breaks 3 more' && grep -q 'a tool to a sentence' config/roles/maintainer.md"]
timeout_secs = 900

[[check]]
id = "class-closed-by-check"
tier = "hermetic"
bead = "sf-gl5.11"
claim = "A filed bead may name the class of defect its check closes, and a name that is not a class key is refused. While the bead is open the class has a check being built, a second bead does not take its place, and builders are still told of the class; when the bead lands the class is recorded as checked at the count of beads it had broken and is no longer in a builder's brief; when it breaks another bead it is told again and a new bead may answer it."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--lib", "--", "a_class_leaves_the_builders_brief", "a_maintenance_run_has_beads_built_only_when"]
timeout_secs = 900

[[check]]
id = "class-check-recorded"
tier = "hermetic"
bead = "sf-gl5.11"
claim = "With a real pipeline: a bead a maintenance run files with the class it closes is kept as that class's check; the next run's measures show the class with the check being built; when the bead's pull request lands the class is recorded as checked, and the run after is shown that."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--test", "walk", "--", "a_maintenance_run_builds_what_it_marks"]
timeout_secs = 900

[[check]]
id = "class-check-roles"
tier = "hermetic"
bead = "sf-gl5.11"
claim = "The maintainer's, the director's and the foreman's roles say to file the tool that catches a kind of mistake with the class it closes, and `factory findings` prints each class with its check."
command = ["sh", "-c", "grep -q 'closes_class' config/roles/maintainer.md && grep -q 'closes_class' config/roles/director.md && grep -q 'closes_class' config/roles/foreman.md && grep -q 'check.words(count.beads)' crates/factory-cli/src/main.rs"]
timeout_secs = 30

[[check]]
id = "schedule-found-at-start"
tier = "host"
bead = "sf-gl5.6"
claim = "On a Temporal server started on this machine, with the real engine command: a project whose workflow waits with nothing due is given a schedule whose time has passed, and the worker started in the old one's place has it look at once; the overdue run is made in that turn, its bead is filed, and the workflow then waits for the next time without looking again."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-engine", "--test", "pipeline", "--", "a_schedule_new_to_a_project_is_run_when_a_worker_starts_with_it_overdue"]
timeout_secs = 900

[[check]]
id = "branch-ci-verdict"
tier = "hermetic"
bead = "sf-gl5.8"
claim = "A branch's own CI is judged by the workflow runs on the newest commit it ran on: one failure is red whatever else is running, an older commit's failure says nothing, and runs that were only cancelled or skipped are neither a pass nor a failure."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-github", "--lib", "--", "a_branch_is_judged_by_the_runs"]
timeout_secs = 900

[[check]]
id = "red-default-branch"
tier = "hermetic"
bead = "sf-gl5.8"
claim = "While the default branch's own CI has failed on its newest commit, a director's brief says so with the run, the owner is told once for that commit in the project's channel, and code refuses a ship; a ship the director declares as the fix goes ahead, is logged with the reason, and once it lands and the branch passes nothing more is said or refused."
command = ["cargo", "test", "--locked", "--offline", "--package", "factory-driver", "--", "nothing_ships_while_the_default_branch_is_red", "a_director_with_foremen_opens_answers_and_ships"]
timeout_secs = 900
