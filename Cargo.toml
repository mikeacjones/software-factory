[workspace]
resolver = "3"
members = ["xtask", "crates/*"]
# Each fixture is its own tiny workspace, checked by `cargo xtask selftest`.
exclude = ["xtask/fixtures"]

[workspace.dependencies]
factory-beads = { path = "crates/factory-beads" }
factory-brief = { path = "crates/factory-brief" }
factory-checks = { path = "crates/factory-checks" }
factory-claude = { path = "crates/factory-claude" }
factory-config = { path = "crates/factory-config" }
factory-core = { path = "crates/factory-core" }
factory-driver = { path = "crates/factory-driver" }
factory-flow = { path = "crates/factory-flow" }
factory-git = { path = "crates/factory-git" }
factory-github = { path = "crates/factory-github" }
factory-slack = { path = "crates/factory-slack" }
factory-supervise = { path = "crates/factory-supervise" }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
thiserror = "2"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "1"
toml = "1"
ureq = { version = "3", features = ["json"] }

[workspace.package]
edition = "2024"
rust-version = "1.100"
publish = false

# Conventions every crate follows (see docs/architecture.md and AGENTS.md):
# errors are typed enums, and nothing panics outside tests.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
