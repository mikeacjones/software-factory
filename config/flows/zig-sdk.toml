# The flow for temporal-sdk-zig: build-break-review, with this project's own
# checks around it.
#
# Before any model runs, the unit tests are run on the untouched base. That
# proves the default branch is green, so a later failure is the change's
# fault, and it builds the Rust core once so the builder's own runs are fast.
#
# After the builder: formatting, the generated samples index, README examples,
# changelog fragments, the unit tests in both modes, and every sample against a
# dev server. Then the project's review reports are written, and a fresh
# adversarial tester tries to break the change by running it and a fresh
# reviewer reads it, both starting from those reports. The builder's session is continued for every fix
# and for the publication text. The factory commits, pushes and opens the pull
# request, watches its CI, and merges it when every check has passed.
id = "zig-sdk"
start = "baseline"

[[step]]
id = "baseline"
kind = "command"
command = "test"
on.pass = "build"
on.fail = "park"

[[step]]
id = "build"
kind = "agent"
role = "builder"
model = "claude-opus-5-5"
effort = "medium"
session = "fresh"
writes = ["code"]
on.done = "fmt"
on.already_done = "park"
on.needs_owner = { to = "ask", max = 3 }

[[step]]
id = "fmt"
kind = "command"
command = "fmt"
on.pass = "index"
on.fail = { to = "fix", max = 2 }

# samples/dispatch.zig is generated from the samples; it must be current.
[[step]]
id = "index"
kind = "command"
command = "samples-index"
on.pass = "readme"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "readme"
kind = "command"
command = "readme"
on.pass = "changelog"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "changelog"
kind = "command"
command = "changelog"
on.pass = "test"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "test"
kind = "command"
command = "test"
on.pass = "test-safe"
on.fail = { to = "fix", max = 3 }

# Fiber and bridge code has failed only under optimization before.
[[step]]
id = "test-safe"
kind = "command"
command = "test-releasesafe"
on.pass = "samples"
on.fail = { to = "fix", max = 2 }

# A finished sample stays in the suite: breaking one is a regression.
[[step]]
id = "samples"
kind = "command"
command = "samples-test"
on.pass = "test-linux"
on.fail = { to = "fix", max = 2 }

# Everything above ran on this machine's own platform. CI also tests Linux,
# and what fails only there is found here first, before anything is pushed.
[[step]]
id = "test-linux"
kind = "command"
command = "test-linux"
on.pass = "reports"
on.fail = { to = "fix", max = 3 }

# The project's own review reports: scanners, the public API diff, hazard
# scans of the added lines. Written by tools, with no model, into a directory
# the factory makes outside the worktree. The steps below that say they need
# `reports` are briefed with its index. The validator proves the reports are
# always about the code those steps look at: every fix passes through here
# again.
[[step]]
id = "reports"
kind = "command"
command = "reports"
policy = "report-only"
produces = "reports"
on.pass = "proof"
# The reports are advisory as a whole, but the project names a few results
# that must not pass (see `fail_when` on the command). Those go back to the
# builder before any agent spends time on the change.
on.fail = { to = "fix", max = 2 }

# Each test the change adds or alters is run on the code as it was at the
# base, by a tool (see the command). One that passes there does not test the
# change and goes back to the builder. The tester and the reviewer are given
# the result, so neither is asked what a command has settled.
[[step]]
id = "proof"
kind = "command"
command = "test-proof"
produces = "test-proof"
on.pass = "break"
on.fail = { to = "fix", max = 2 }

# Not a reader: it runs the change and hunts for inputs and sequences that
# break it. Every finding carries a reproduction it ran.
[[step]]
id = "break"
kind = "agent"
role = "tester"
model = "claude-opus-5-5"
effort = "high"
session = "fresh"
workspace = "scratch"
needs = ["reports", "test-proof"]
on.held = "review"
# Every break is proved by a failing test the factory commits to the branch,
# and a change with a failing test is not a reviewer's to wave through. So a
# break always goes back to the builder. After three fixes the pipeline parks
# with the finding: whoever runs it (a sub-goal's foreman, the goal's
# director, or the owner) reads it and continues it or gives it up.
on.broken = { to = "fix", max = 3 }
on.needs_owner = { to = "ask", max = 2 }

[[step]]
id = "review"
kind = "agent"
role = "reviewer"
model = "claude-opus-5-5"
effort = "medium"
session = "fresh"
workspace = "scratch"
needs = ["reports", "test-proof"]
on.approve = "describe"
on.rework = { to = "fix", max = 2 }
on.needs_owner = { to = "ask", max = 2 }

# Every way back leads here, and from here through every check again.
[[step]]
id = "fix"
kind = "agent"
role = "builder"
model = "claude-opus-5-5"
effort = "medium"
session = "continue:build"
# From its second round on the fix gets more effort: by then the first
# attempt has not held.
effort_by_round = ["medium", "high"]
writes = ["code"]
on.done = { to = "fmt", max = 8 }
on.needs_owner = { to = "ask", max = 2 }

[[step]]
id = "describe"
kind = "agent"
role = "publisher"
model = "claude-opus-5-5"
effort = "medium"
session = "continue:build"
on.ready = "publish"

[[step]]
id = "publish"
kind = "action"
action = "publish"
on.done = "ci"
# A check on the final commit failed: the text is written again.
on.failed = { to = "describe", max = 2 }

# No model from here on unless CI fails. The factory polls the pull request's
# checks. A failed check ends the wait once the checks still running have
# finished: every failure and its log goes to the builder together, and the
# fix goes through every step above again before it is republished.
[[step]]
id = "ci"
kind = "action"
action = "await-ci"
on.green = "land"
on.red = { to = "fix", max = 2 }

# Every check passed: merge, confirm the merge commit is on the default
# branch, close the bead, remove the worktree. No agent is asked.
[[step]]
id = "land"
kind = "action"
action = "land"
on.done = "end"
on.failed = "park"
