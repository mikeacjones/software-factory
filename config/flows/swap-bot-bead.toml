# The pipeline of one bead inside a sub-goal of the swap bot: the light half
# of a pair with swap-bot-ship, after zig-sdk-bead. It builds one bead,
# checks and tests it, has it adversarially tested and reviewed, and absorbs
# it as one commit into the sub-goal's branch. The pull request, CI and the
# landing are the ship pipeline's, once for the whole sub-goal.
#
# Models as in the swap-bot flow: builders and testers on Sonnet, the
# reviewer and the publisher on Opus (owner's decision, 2026-11-18).
id = "swap-bot-bead"
start = "build"

[[step]]
id = "build"
kind = "agent"
role = "builder"
model = "claude-sonnet-5-5"
effort = "high"
session = "fresh"
writes = ["code"]
on.done = "checks"
on.already_done = "park"
on.needs_owner = { to = "ask", max = 3 }

[[step]]
id = "checks"
kind = "command"
command = "typecheck"
on.pass = "test"
on.fail = { to = "fix", max = 3 }

[[step]]
id = "test"
kind = "command"
command = "test"
on.pass = "break"
on.fail = { to = "fix", max = 3 }

[[step]]
id = "break"
kind = "agent"
role = "tester"
model = "claude-sonnet-5-5"
effort = "high"
session = "fresh"
workspace = "scratch"
on.held = "review"
on.broken = { to = "fix", max = 3 }
on.needs_owner = { to = "ask", max = 2 }

[[step]]
id = "review"
kind = "agent"
role = "reviewer"
model = "claude-opus-5-5"
effort = "medium"
session = "fresh"
workspace = "scratch"
on.approve = "describe"
on.rework = { to = "fix", max = 2 }
on.needs_owner = { to = "ask", max = 2 }

[[step]]
id = "fix"
kind = "agent"
role = "builder"
model = "claude-sonnet-5-5"
effort = "high"
session = "continue:build"
writes = ["code"]
on.done = { to = "checks", max = 8 }
on.needs_owner = { to = "ask", max = 2 }
on.already_done = { to = "checks", max = 2 }

# The bead's commit message. The sub-goal's pull request is written when it
# ships.
[[step]]
id = "describe"
kind = "agent"
role = "publisher"
model = "claude-opus-5-5"
effort = "medium"
session = "fresh"
on.ready = "absorb"

# One commit onto the sub-goal's branch. Nothing is pushed, and the bead
# stays open until the sub-goal lands. When another bead was absorbed while
# this one was in its pipeline, the branch is merged in and checked again
# first; a conflict goes back to this bead's builder.
[[step]]
id = "absorb"
kind = "action"
action = "absorb"
on.done = "end"
on.failed = { to = "describe", max = 2 }
on.moved = "recheck-checks"
on.conflict = { to = "fix", max = 3 }

[[step]]
id = "recheck-checks"
kind = "command"
command = "typecheck"
on.pass = "recheck-test"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "recheck-test"
kind = "command"
command = "test"
on.pass = { to = "absorb", max = 6 }
on.fail = { to = "fix", max = 2 }
