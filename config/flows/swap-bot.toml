# One bead of the swap bot, from its base to a squash-merged pull request.
# Builders and testers run on Sonnet; the reviewer and the publisher, like
# every other agent of this project, on Opus (owner's decision, 2026-11-18).
id = "swap-bot"
start = "baseline"

# The base must pass before anything is built on it: a failure that was
# already there is not the bead's to fix.
[[step]]
id = "baseline"
kind = "command"
command = "test"
on.pass = "build"
on.fail = "park"

[[step]]
id = "build"
kind = "agent"
role = "builder"
model = "claude-sonnet-5-5"
effort = "high"
session = "fresh"
writes = ["code"]
on.done = "checks"
on.already_done = "park"
on.needs_owner = { to = "ask", max = 3 }

[[step]]
id = "checks"
kind = "command"
command = "typecheck"
on.pass = "test"
on.fail = { to = "fix", max = 3 }

[[step]]
id = "test"
kind = "command"
command = "test"
on.pass = "break"
on.fail = { to = "fix", max = 3 }

[[step]]
id = "break"
kind = "agent"
role = "tester"
model = "claude-sonnet-5-5"
effort = "high"
session = "fresh"
workspace = "scratch"
on.held = "review"
on.broken = { to = "fix", max = 3 }
on.needs_owner = { to = "ask", max = 2 }

[[step]]
id = "review"
kind = "agent"
role = "reviewer"
model = "claude-opus-5-5"
effort = "medium"
session = "fresh"
workspace = "scratch"
on.approve = "describe"
on.rework = { to = "fix", max = 2 }
on.needs_owner = { to = "ask", max = 2 }

[[step]]
id = "fix"
kind = "agent"
role = "builder"
model = "claude-sonnet-5-5"
effort = "high"
session = "continue:build"
writes = ["code"]
on.done = { to = "checks", max = 8 }
on.needs_owner = { to = "ask", max = 2 }
on.already_done = { to = "checks", max = 2 }

[[step]]
id = "describe"
kind = "agent"
role = "publisher"
model = "claude-opus-5-5"
effort = "medium"
session = "continue:build"
on.ready = "publish"

[[step]]
id = "publish"
kind = "action"
action = "publish"
on.done = "ci"
on.failed = { to = "describe", max = 2 }

[[step]]
id = "ci"
kind = "action"
action = "await-ci"
on.green = "land"
on.red = { to = "fix", max = 2 }

# A squash merge on main, which devvit-publish.yml then publishes to Reddit
# (owner's decision, 2026-11-18: dependency bumps go live once CI is green).
[[step]]
id = "land"
kind = "action"
action = "land"
on.done = "end"
on.failed = "park"
