# The pipeline that ships a sub-goal of the swap bot: the heavy half of the
# pair with swap-bot-bead, after zig-sdk-ship. It runs once on the
# sub-goal's branch, which holds one commit for each bead, every one already
# built, tested and reviewed by itself. The default branch is taken in, the
# whole is checked and tested, a reviewer reads the beads together, and one
# pull request is opened, watched through CI and squash-merged. Landing
# closes every bead of the sub-goal, and devvit-publish.yml then publishes
# the bot to Reddit.
#
# A failure here has no builder session to return to, so the fix step is a
# fresh builder on the sub-goal's branch, briefed with the failure.
id = "swap-bot-ship"
start = "sync"

[[step]]
id = "sync"
kind = "action"
action = "sync"
on.current = "checks"
on.moved = "checks"
on.conflict = "fix"

[[step]]
id = "checks"
kind = "command"
command = "typecheck"
on.pass = "test"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "test"
kind = "command"
command = "test"
on.pass = "review"
on.fail = { to = "fix", max = 3 }

# The beads read together: do they fit, does the whole meet the sub-goal?
[[step]]
id = "review"
kind = "agent"
role = "reviewer"
model = "claude-opus-5-5"
effort = "medium"
session = "fresh"
workspace = "scratch"
on.approve = "describe"
on.rework = { to = "fix", max = 2 }
on.needs_owner = { to = "ask", max = 2 }

[[step]]
id = "fix"
kind = "agent"
role = "builder"
model = "claude-sonnet-5-5"
effort = "high"
session = "fresh"
writes = ["code"]
on.done = { to = "checks", max = 6 }
on.needs_owner = { to = "ask", max = 2 }
on.already_done = { to = "sync", max = 2 }

[[step]]
id = "describe"
kind = "agent"
role = "publisher"
model = "claude-opus-5-5"
effort = "medium"
session = "fresh"
on.ready = "publish"

[[step]]
id = "publish"
kind = "action"
action = "publish"
on.done = "ci"
on.failed = { to = "fix", max = 2 }
on.conflict = { to = "fix", max = 2 }

[[step]]
id = "ci"
kind = "action"
action = "await-ci"
on.green = "land"
on.red = { to = "fix", max = 2 }

[[step]]
id = "land"
kind = "action"
action = "land"
on.done = "end"
on.failed = "park"
