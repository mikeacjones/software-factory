# Build, check, break, review, publish.
#
# One builder session implements the bead and is continued for every fix and
# for the publication text. The project's commands run after every change. A
# fresh adversarial tester then tries to break the change by running it, and a
# fresh reviewer reads it. Either can send the work back. The factory commits,
# pushes and opens the pull request.
#
# A project using this flow defines the commands fmt, readme, changelog and
# test, and the path scope code.
id = "build-break-review"
start = "build"

[[step]]
id = "build"
kind = "agent"
role = "builder"
model = "claude-opus-5-5"
effort = "medium"
session = "fresh"
writes = ["code"]
on.done = "checks"
on.already_done = "park"
on.needs_owner = { to = "ask", max = 3 }

# The quick checks, all at the same time. Every one runs to its end, and a
# builder sent back is given every one that failed, not only the first.
[[step]]
id = "checks"
kind = "commands"
commands = ["fmt", "readme", "changelog"]
on.pass = "test"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "test"
kind = "command"
command = "test"
on.pass = "break"
on.fail = { to = "fix", max = 3 }

# Not a reader: it runs the change and hunts for inputs and sequences that
# break it. Every finding carries a reproduction it ran.
[[step]]
id = "break"
kind = "agent"
role = "tester"
model = "claude-opus-5-5"
effort = "high"
session = "fresh"
workspace = "scratch"
on.held = "review"
# Every break is proved by a failing test the factory commits to the branch,
# and a change with a failing test is not a reviewer's to wave through. So a
# break always goes back to the builder. After three fixes the pipeline parks
# with the finding: whoever runs it (a sub-goal's foreman, the goal's
# director, or the owner) reads it and continues it or gives it up.
on.broken = { to = "fix", max = 3 }
on.needs_owner = { to = "ask", max = 2 }

[[step]]
id = "review"
kind = "agent"
role = "reviewer"
model = "claude-opus-5-5"
effort = "medium"
session = "fresh"
workspace = "scratch"
on.approve = "describe"
on.rework = { to = "fix", max = 2 }
on.needs_owner = { to = "ask", max = 2 }

# Every way back leads here, and from here through every check again.
[[step]]
id = "fix"
kind = "agent"
role = "builder"
model = "claude-opus-5-5"
effort = "medium"
session = "continue:build"
effort_by_round = ["medium", "high"]
writes = ["code"]
on.done = { to = "checks", max = 8 }
on.needs_owner = { to = "ask", max = 2 }
# Nothing in the branch needed changing: every check runs again.
on.already_done = { to = "checks", max = 2 }

[[step]]
id = "describe"
kind = "agent"
role = "publisher"
model = "claude-opus-5-5"
effort = "medium"
session = "continue:build"
on.ready = "publish"

[[step]]
id = "publish"
kind = "action"
action = "publish"
on.done = "end"
# A check on the final commit failed: the text is written again.
on.failed = { to = "describe", max = 2 }
