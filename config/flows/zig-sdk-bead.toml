# The pipeline of one bead inside a sub-goal of the Zig SDK. It is the light
# half of a pair: this flow builds one bead, checks it quickly, has it
# adversarially tested and reviewed, and absorbs it as one commit into the
# sub-goal's branch. The heavy half, zig-sdk-ship, runs once for the whole
# sub-goal.
#
# Left to the ship pipeline on purpose: the baseline run, the ReleaseSafe
# tests, the samples against a dev server, the pull request and CI. A bead
# costs minutes here, not most of an hour.
id = "zig-sdk-bead"
start = "build"

[[step]]
id = "build"
kind = "agent"
role = "builder"
model = "claude-opus-5-5"
effort = "medium"
session = "fresh"
writes = ["code"]
on.done = "fmt"
on.already_done = "park"
on.needs_owner = { to = "ask", max = 3 }

[[step]]
id = "fmt"
kind = "command"
command = "fmt"
on.pass = "index"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "index"
kind = "command"
command = "samples-index"
on.pass = "readme"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "readme"
kind = "command"
command = "readme"
on.pass = "changelog"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "changelog"
kind = "command"
command = "changelog"
on.pass = "test"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "test"
kind = "command"
command = "test"
on.pass = "test-safe"
on.fail = { to = "fix", max = 3 }

# The project requires the optimized test run for changes to the workflow
# runtime, the fibers and the bridge, where code has failed only under
# optimization. It runs here when the bead touches them, while the builder's
# session is still at hand; every sub-goal gets it once more when it ships.
[[step]]
id = "test-safe"
kind = "command"
command = "test-releasesafe"
when_changed = ["runtime"]
on.pass = "reports"
on.fail = { to = "fix", max = 2 }

# The review reports, about this bead's change only: its base is the
# sub-goal's tip when the bead started.
[[step]]
id = "reports"
kind = "command"
command = "reports"
policy = "report-only"
produces = "reports"
on.pass = "proof"
# The reports are advisory as a whole, but the project names a few results
# that must not pass (see `fail_when` on the command). Those go back to the
# builder before any agent spends time on the change.
on.fail = { to = "fix", max = 2 }

# Each test the change adds or alters is run on the code as it was at the
# base, by a tool (see the command). One that passes there does not test the
# change and goes back to the builder. The tester and the reviewer are given
# the result, so neither is asked what a command has settled.
[[step]]
id = "proof"
kind = "command"
command = "test-proof"
produces = "test-proof"
on.pass = "break"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "break"
kind = "agent"
role = "tester"
model = "claude-opus-5-5"
effort = "high"
session = "fresh"
workspace = "scratch"
needs = ["reports", "test-proof"]
on.held = "review"
# Every break is proved by a failing test the factory commits to the branch,
# and a change with a failing test is not a reviewer's to wave through. So a
# break always goes back to the builder. After three fixes the pipeline parks
# with the finding: whoever runs it (a sub-goal's foreman, the goal's
# director, or the owner) reads it and continues it or gives it up.
on.broken = { to = "fix", max = 3 }
on.needs_owner = { to = "ask", max = 2 }

[[step]]
id = "review"
kind = "agent"
role = "reviewer"
model = "claude-opus-5-5"
effort = "medium"
session = "fresh"
workspace = "scratch"
needs = ["reports", "test-proof"]
on.approve = "describe"
on.rework = { to = "fix", max = 2 }
on.needs_owner = { to = "ask", max = 2 }

[[step]]
id = "fix"
kind = "agent"
role = "builder"
model = "claude-opus-5-5"
effort = "medium"
session = "continue:build"
# From its second round on the fix gets more effort: by then the first
# attempt has not held.
effort_by_round = ["medium", "high"]
writes = ["code"]
on.done = { to = "fmt", max = 8 }
on.needs_owner = { to = "ask", max = 2 }
# Nothing in the branch needed changing: every check runs again.
on.already_done = { to = "fmt", max = 2 }

# The bead's commit message. The pull-request text it also writes is not
# used here: the sub-goal's pull request is written when it ships.
[[step]]
id = "describe"
kind = "agent"
role = "publisher"
model = "claude-opus-5-5"
effort = "medium"
session = "continue:build"
on.ready = "absorb"

# One commit onto the sub-goal's branch. Nothing is pushed, and the bead
# stays open until the sub-goal lands.
[[step]]
id = "absorb"
kind = "action"
action = "absorb"
on.done = "end"
on.failed = { to = "describe", max = 2 }
# Beads of one sub-goal may be built side by side. When another was absorbed
# while this one was in its pipeline, the sub-goal's branch is merged into
# this one's and nothing is absorbed yet. A clean merge has the checks run
# again on the two together; a conflict goes back to this bead's builder,
# and from there through the whole pipeline again.
on.moved = "recheck-fmt"
on.conflict = { to = "fix", max = 3 }

# The checks again, after another bead's work was merged in cleanly. No agent
# runs: this bead's own change is what the tester and the reviewer already
# passed, and the two beads are reviewed together when the sub-goal ships.
[[step]]
id = "recheck-fmt"
kind = "command"
command = "fmt"
on.pass = "recheck-index"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "recheck-index"
kind = "command"
command = "samples-index"
on.pass = "recheck-readme"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "recheck-readme"
kind = "command"
command = "readme"
on.pass = "recheck-changelog"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "recheck-changelog"
kind = "command"
command = "changelog"
on.pass = "recheck-test"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "recheck-test"
kind = "command"
command = "test"
on.pass = "recheck-test-safe"
on.fail = { to = "fix", max = 2 }

[[step]]
id = "recheck-test-safe"
kind = "command"
command = "test-releasesafe"
when_changed = ["runtime"]
# Back to the absorb. If yet another bead got there first, round again.
on.pass = { to = "absorb", max = 6 }
on.fail = { to = "fix", max = 2 }
