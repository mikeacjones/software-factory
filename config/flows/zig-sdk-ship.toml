# The pipeline that ships a sub-goal of the Zig SDK: the heavy half of the
# pair with zig-sdk-bead. It runs once on the sub-goal's branch, which holds
# one commit for each bead, every one already built, adversarially tested and
# reviewed by itself.
#
# Here the whole repository is verified once: the fast checks, the unit tests
# in both modes and every sample against a dev server. Then the review
# reports are written for the whole diff and a reviewer reads the beads
# together, which no bead's own reviewer could. One pull request is opened
# with the commits as they are, CI is watched, and it is squashed onto the
# default branch. Landing closes every bead of the sub-goal.
#
# A failure here has no builder session to return to, so the fix step is a
# fresh builder on the sub-goal's branch, briefed with the failure.
id = "zig-sdk-ship"
start = "sync"

# Other work may have landed since this branch was cut: another sub-goal of
# the same goal, or anything else. The default branch is taken in first, so
# that everything below verifies what will actually land. Sub-goals ship one
# at a time, which makes this the point where one is folded onto the last.
# A conflict goes to the fix step, and from there through all of it.
[[step]]
id = "sync"
kind = "action"
action = "sync"
on.current = "checks"
on.moved = "checks"
on.conflict = "fix"

# The fast checks, all at the same time. Every one runs to its end, and the
# builder sent back is given every one that failed, not only the first. The
# index is regenerated first and alone (the project marks it `edits`), so no
# other check reads the file while it is rewritten.
[[step]]
id = "checks"
kind = "commands"
commands = ["fmt", "samples-index", "readme", "changelog"]
on.pass = "tests"
on.fail = { to = "fix", max = 2 }

# The tests, all at the same time: the unit tests in both modes, every sample
# against a dev server, and the unit tests on Linux. CI also tests Linux, and
# what fails only there is found here first, before anything is pushed.
[[step]]
id = "tests"
kind = "commands"
commands = ["test", "test-releasesafe", "samples-test", "test-linux"]
on.pass = "reports"
on.fail = { to = "fix", max = 3 }

[[step]]
id = "reports"
kind = "command"
command = "reports"
policy = "report-only"
produces = "reports"
on.pass = "review"
# The reports are advisory as a whole, but the project names a few results
# that must not pass (see `fail_when` on the command). Those go back to the
# builder before any agent spends time on the change.
on.fail = { to = "fix", max = 2 }

# The beads read together: do they fit, does the whole meet the sub-goal?
[[step]]
id = "review"
kind = "agent"
role = "reviewer"
model = "claude-opus-5-5"
effort = "medium"
session = "fresh"
workspace = "scratch"
needs = ["reports"]
on.approve = "describe"
on.rework = { to = "fix", max = 2 }
on.needs_owner = { to = "ask", max = 2 }

[[step]]
id = "fix"
kind = "agent"
role = "builder"
model = "claude-opus-5-5"
effort = "medium"
session = "fresh"
# From its second round on the fix gets more effort: by then the first
# attempt has not held.
effort_by_round = ["medium", "high"]
writes = ["code"]
on.done = { to = "checks", max = 6 }
on.needs_owner = { to = "ask", max = 2 }
# Nothing in the branch needed changing: the failure it was sent for is
# not the branch's, or is fixed on the default branch. The ship takes the
# default branch in again and runs every check.
on.already_done = { to = "sync", max = 2 }

# The text of the one pull request, and of the one commit it becomes.
[[step]]
id = "describe"
kind = "agent"
role = "publisher"
model = "claude-opus-5-5"
effort = "medium"
session = "fresh"
on.ready = "publish"

[[step]]
id = "publish"
kind = "action"
action = "publish"
on.done = "ci"
on.failed = { to = "describe", max = 2 }
# Nothing is pushed while a file still holds a marker from the merge above.
on.conflict = { to = "fix", max = 2 }

[[step]]
id = "ci"
kind = "action"
action = "await-ci"
on.green = "land"
on.red = { to = "fix", max = 2 }

[[step]]
id = "land"
kind = "action"
action = "land"
on.done = "end"
on.failed = "park"
