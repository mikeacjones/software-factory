# Upkeep of the Zig SDK: a run the factory starts by itself, with no
# message from the owner. One agent, the maintainer, is given the charter
# below and what the factory's records show since its last run, reads the
# default branch, and files beads. The ones it marks to build are built
# without anyone being asked: the factory opens a goal for them under the
# definition named in `build_under`, starts it, and ends it when they are
# closed. Owner's decision, 2026-11-16: the loop from what testers find to
# the check that stops it must close without the owner in it.
id = "upkeep"

# The agent of each run. A scheduled definition has no director; this table
# gives the maintainer its model, effort and time limit.
[director]
# Opus: it files beads from what the records show, and every bead it marks
# to build still goes through the whole pipeline and its review.
model = "claude-opus-5-5"
effort = "high"
timeout_secs = 2700

[schedule]
# Once a week, at 10:00 UTC. A time the worker was away for is made up
# once, when it is back. While a run reads, no other tier of the project is
# woken; pipelines carry on.
hour_utc = 10
every_days = 7
# And at once, whenever a class of defect has broken three beads more than
# a run was last shown. Code counts them from the units' records.
when_class_breaks = 3
# What a run marks to build is built by a goal under this definition: its
# director, designer, foreman and pipelines, one pull request, CI. One such
# goal at a time; while it builds, a run only files.
build_under = "parity"
# The most beads one run may file. What it leaves out goes in its journal
# for the next run.
max_beads = 3
# Commands of the project to run on the default branch before each run, for
# what the factory's own records cannot show. Their output goes in the
# maintainer's brief, whether they pass or fail. None yet: a report of
# duplicated code waits for the project to have a command that makes one.
reports = []
charter = """
Keep the quality of the Zig SDK from slipping between goals. Three things, \
in this order. First, what the pipelines keep getting wrong: where a class \
of defect has broken several beads, find the tool that would have stopped \
every case and have it built: a lint rule, a check in `zig build`, a test \
helper, a fuzz or property test, in a place every bead's pipeline already \
runs. Not the cases, and not a sentence in AGENTS.md or CONTRIBUTING.md \
unless no tool can see the mistake. \
Second, checks that cannot be trusted: one that fails and then passes on \
the same commit, or a pull request whose CI went red after the pipeline's \
own checks passed, means something differs between the two; say what. \
Third, code that has outgrown its shape: a file that keeps growing, or a \
bead that took many rounds of fixing in one place, may need splitting or a \
clearer boundary before the next bead lands in it.

Not yours yet: bumping sdk-core, new Temporal features, moving features \
from contrib to GA, and anything the open goals' beads already cover. If \
you see such work, say so in a sentence in the digest.
"""
