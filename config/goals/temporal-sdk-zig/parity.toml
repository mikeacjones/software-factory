# How goals run on the Zig SDK. A goal itself starts as a message from the
# owner in #temporal-sdk-zig; this says who directs it and what it may do.
id = "parity"
default = true

# A goal is worked in sub-goals, each landing as one pull request. Every bead
# goes through the light pipeline and is absorbed into its sub-goal's branch;
# the heavy pipeline runs once when the director ships the sub-goal.
flow = "zig-sdk-bead"
ship_flow = "zig-sdk-ship"
# The most pipelines the whole goal may have running at once.
max_pipelines = 2
# Files nearly every bead adds to. They never count when beads or sub-goals
# are checked for overlap, or nothing could ever run side by side: the
# project's own rules have each bead update its PARITY.md rows, its README
# section and a changelog fragment. What two pieces of work both changed in
# one of these is folded together when the second is absorbed or shipped.
shared_paths = ["README.md", "PARITY.md", "CHANGELOG.md", "changelog", "samples/README.md", "samples/dispatch.zig"]

# The standing objective, for a goal the owner opens without saying more. The
# opening conversation turns it into a charter the owner agrees to.
objective = "Reach GA parity with the other Temporal SDKs."
stop_when = "All GA features and capabilities match."

# Two tiers of agents run a goal. The director plans the goal in sub-goals,
# opens them, and ships each as one pull request. Each sub-goal's foreman
# starts its beads, rules on their findings and reports to the director when
# the sub-goal is ready or when it needs an answer.
#
# `slots` is the most work a tier may have running below it at once. It is a
# limit, never a target. The agent at that level runs work side by side only
# when it has declared, for each piece, the paths it will change, and code
# finds no overlap; otherwise one after the other.
#
# The foreman's are bead pipelines in its sub-goal. The bead absorbed second
# has the first merged into it and its checks run again. The director's are
# sub-goals that have not landed. They ship one at a time, each taking in
# what landed before it and only then being verified: a conflict there, in
# code or in a shared file, goes to the builder on the sub-goal's branch, and
# the whole verification runs on the result before the pull request opens.
[director]
model = "claude-fable-5-2"
effort = "high"
timeout_secs = 2400
slots = 2

[foreman]
model = "claude-opus-5-5"
effort = "high"
timeout_secs = 1800
slots = 2

# Before anything is built in a sub-goal, its designer decides what every
# builder would otherwise decide alone, one bead at a time: the public
# interface the sub-goal adds or changes, its errors and invariants, where
# the code goes, and the order of the beads. The director accepts the design
# or sends it back, and every builder, tester and reviewer of the sub-goal
# is given what was accepted. A designer may also say the sub-goal is split
# wrongly, which goes to the director.
#
# It runs as a turn of the project's tiers, like the foreman, so while it
# reads no other tier of the project is woken. Pipelines carry on.
[designer]
model = "claude-fable-5-2"
effort = "high"
timeout_secs = 2700

[permissions]
# New beads, with their type, priority and deferral, are the director's call.
file_beads = "allow"
# Changing a bead that exists (its acceptance criteria, its priority, deferring
# it): the director decides alone for a bead this goal's own agents filed,
# such as the bug behind a test that fails now and then, whose priority has
# to follow what it turns out to cost. A bead the owner wrote is put to the
# owner. "ask" puts every change to the owner, "allow" none.
edit_beads = "own"
