# How goals run on the Zig SDK. A goal itself starts as a message from the
# owner in #temporal-sdk-zig; this says who directs it and what it may do.
id = "parity"
default = true

# A goal is worked in sub-goals, each landing as one pull request. Every bead
# goes through the light pipeline and is absorbed into its sub-goal's branch;
# the heavy pipeline runs once when the director ships the sub-goal.
flow = "zig-sdk-bead"
ship_flow = "zig-sdk-ship"
max_pipelines = 1

# The standing objective, for a goal the owner opens without saying more. The
# opening conversation turns it into a charter the owner agrees to.
objective = "Reach GA parity with the other Temporal SDKs."
stop_when = "All GA features and capabilities match."

# Two tiers of agents run a goal. The director plans the goal in sub-goals,
# opens them, and ships each as one pull request. Each sub-goal's foreman
# starts its beads, rules on their findings and reports to the director when
# the sub-goal is ready or when it needs an answer. `slots` is the most work a
# tier may have running below it at once; it is 1 until work run side by
# side can be folded back together.
[director]
model = "claude-fable-5-2"
effort = "high"
timeout_secs = 2400

[foreman]
model = "claude-opus-5-5"
effort = "high"
timeout_secs = 1800

[permissions]
# New beads, with their type, priority and deferral, are the director's call.
file_beads = "allow"
# Changing a bead that exists (its acceptance criteria, its priority, deferring
# it) is put to the owner. Set to "allow" to let the director decide alone.
edit_beads = "ask"
