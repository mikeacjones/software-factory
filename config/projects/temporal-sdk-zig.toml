id = "temporal-sdk-zig"
repo = "~/Source/temporal-sdk-zig"
remote = "origin"
default_branch = "main"
bead_actor = "factory"
slack_channel = "temporal-sdk-zig"
flow = "zig-sdk"
# Every branch the factory is working on is kept on the remote as it changes:
# a bead's after each step and whenever its agent commits, a sub-goal's after
# each bead it absorbs. Work in hand then survives the loss of this machine.
# A bead's branch leaves the remote once its work is on its sub-goal's branch
# and that branch has been pushed. CI here runs on pull requests and on main,
# so these pushes start none.
sync_branches = true
publication_note = """
End the commit message with a trailer block: one `Bead: <full bead ID>` line for each bead the change covers, which is the trailer this repository's history uses (not `Refs:`), and after them the changelog trailer when the change needs one. A pull request is squashed when it lands, so the message written for the whole pull request, with a testing paragraph the factory adds, is what the default branch keeps: write it for someone reading the history a year from now."""

# CI checks out the Rust core as a submodule, so every worktree does too.
setup = ["submodules"]

# The changelog check reads commit messages, and the factory writes the real
# one only when it publishes.
publish_checks = ["changelog-commits"]

# What a test or an assertion looks like in this project. A fix that removes
# such a line is pointed out to the reviewer.
test_patterns = ['^\s*test\s+"', '\btesting\.expect', '\bexpect(Equal|EqualStrings|EqualSlices|Error|ApproxEqAbs)?\(', 'error\.SkipZigTest']

# No bead of the first runs may touch these. A core bump changes
# deps/sdk-core and is not factory work yet.
forbidden_paths = [".github/**", ".beads/**", ".claude/**", "deps/sdk-core", "deps/sdk-core/**", "worktrees/**"]
# The texts the project's code is written to. A builder's first brief and a
# reviewer's name them, and the reviewer judges idiom and quality against
# them. When the project has a standards text of its own, it goes here.
standards = ["AGENTS.md", "CONTRIBUTING.md"]

# The executive is who the owner talks to in #temporal-sdk-zig. A new message
# in the channel goes to it: it answers, or opens a goal under one of the
# definitions in goals/temporal-sdk-zig/ and hands the thread to that goal's
# director. It also decides which goals run at the same time: up to `slots`,
# and only goals whose charters name paths that do not overlap. A goal that
# could touch anything runs alone.
[executive]
model = "claude-fable-5-2"
effort = "high"
timeout_secs = 1800
slots = 2

[beads]
kind = "dolt"
host = "127.0.0.1"
port = 3306
user = "root"
database = "temporal-sdk-zig"

[github]
repo = "mikeacjones/temporal-sdk-zig"
write = ["mikeacjones/temporal-sdk-zig"]
# Every bead has a GitHub issue, and a pull request closes the issues of the
# beads it lands. A bead filed without one gets an issue from the factory.
issues = true
issue_labels = ["type::{type}", "priority::{priority}"]
# The repository's own issue type and Priority field, which GitHub sorts and
# filters by. They are set beside the labels, when a bead's issue is created
# and again whenever work starts on the bead or its priority changes.
# `factory issues sync temporal-sdk-zig` brings every open bead's issue into
# step.
issue_types = { bug = "Bug", feature = "Feature", epic = "Epic", "*" = "Task" }
issue_priority = { field = "Priority", options = ["Critical", "High", "Medium", "Low", "None"] }
ci_poll_secs = 30
ci_timeout_secs = 10800
ci_settle_secs = 60
# The factory's own checks run on macOS. What fails only on GitHub's Linux
# runners can be made to fail, and then to pass, on this machine.
ci_failure_note = """
A check that failed only on Linux can be reproduced on this machine. From the root of your worktree, `sh {config}/tools/temporal-sdk-zig/test-linux.sh Debug` runs `zig build test` on Linux arm64 in a container, set up as CI's Linux runners are, on your worktree as it stands, uncommitted changes included. Name the rows of CI's matrix that failed: `Debug`, `ReleaseSafe`, `musl-Debug`, `musl-ReleaseSafe`, or `all` for the four; several run at the same time. Arguments after `--` go to `zig build test`. It takes a few minutes. Before you change anything, run it and see the failure CI reported. Do not return until `all` passes: a fix you have not seen pass on Linux costs a whole round of CI to find out about."""
# Squash and merge: the default branch gets one commit per bead. Its subject
# is the change's own, with the pull request's number; its body is the
# change's own body, then what was tested, then the commit's trailers.
merge_method = "squash"
merge_subject = "{title} (#{number})"
merge_body = "{commit_body}\n\n{testing}\n\n{commit_trailers}"
delete_branch_after_merge = true
# Green means each of these is present and passed, and nothing else failed.
# A workflow that has not started has created no check, so without this list
# an early look could mistake "not started" for "passed".
required_checks = [
    "check",
    "changelog",
    "samples-test (ubuntu-latest)",
    "samples-test (macos-latest)",
    "unit-test (x86_64-linux-gnu, Debug)",
    "unit-test (x86_64-linux-gnu, ReleaseSafe)",
    "unit-test (aarch64-linux-gnu, Debug)",
    "unit-test (aarch64-linux-gnu, ReleaseSafe)",
    "unit-test (x86_64-linux-musl, Debug)",
    "unit-test (x86_64-linux-musl, ReleaseSafe)",
    "unit-test (aarch64-linux-musl, Debug)",
    "unit-test (aarch64-linux-musl, ReleaseSafe)",
    "unit-test (aarch64-macos, Debug)",
    "unit-test (aarch64-macos, ReleaseSafe)",
    "unit-test (x86_64-macos, Debug)",
    "unit-test (x86_64-macos, ReleaseSafe)",
]

[scopes]
code = ["**"]
# Where the project requires the optimized test run as well.
runtime = ["src/workflow/**", "src/workflow.zig", "src/bridge/**", "src/bridge.zig", "deps/**"]

[commands.submodules]
argv = ["git", "submodule", "update", "--init"]
timeout_secs = 900

[commands.fmt]
argv = ["zig", "build", "fmt"]
timeout_secs = 900

[commands.samples-index]
argv = ["sh", "-c", "zig build samples-index && git diff --exit-code samples/dispatch.zig"]
timeout_secs = 900

[commands.readme]
argv = ["zig", "build", "readme-check"]
timeout_secs = 1800

# The fragment files in the worktree. Which commits carry a fragment or a
# trailer is checked on the final commit: see publish_checks.
[commands.changelog]
argv = ["scripts/changelog-check.sh"]
timeout_secs = 300

[commands.changelog-commits]
argv = ["scripts/changelog-check.sh", "origin/main"]
timeout_secs = 300

# What the factory finds out before a builder is sent for a failed test run
# (see `triage` in the factory's docs): whether the code as it was at the
# unit's base fails the same way, and whether a run failed because the host
# did. sdk-core downloads the dev server and the test server on first use,
# and a download that comes back broken is not the change's.
[commands.test]
argv = ["zig", "build", "test", "--test-timeout", "10m"]
timeout_secs = 3600
could_not_run_when = ["invalid ephemeral server download", "failed to download ephemeral server executable", "Docker is not running"]
failure_lines = ['^error: .* (failed|timed out)', ': error: ', '^panic: ']
triage = { base = true }

[commands.test-releasesafe]
argv = ["zig", "build", "test", "-Doptimize=ReleaseSafe", "--test-timeout", "10m"]
timeout_secs = 3600
could_not_run_when = ["invalid ephemeral server download", "failed to download ephemeral server executable", "Docker is not running"]
failure_lines = ['^error: .* (failed|timed out)', ': error: ', '^panic: ']
triage = { base = true }

# The unit tests on Linux arm64, in containers on this machine, with a tool
# the factory keeps for this project: the four arm64 rows of CI's Linux
# matrix (glibc and musl, Debug and ReleaseSafe), all at the same time.
# GitHub's CI is still what gates a merge, and is the only place the x86_64
# rows run; this is so that a Linux-only failure is found, and its fix seen
# to work, before a pull request is opened or pushed to.
[commands.test-linux]
argv = ["sh", "{config}/tools/temporal-sdk-zig/test-linux.sh", "all"]
timeout_secs = 3600
shown = "zig build test on Linux arm64, glibc and musl, Debug and ReleaseSafe (in containers)"
# Long enough for the script to stop four containers and print their logs.
stop_grace_secs = 60
# The script exits 2 when a container was killed or did not start.
could_not_run_exit = [2]
could_not_run_when = ["invalid ephemeral server download", "failed to download ephemeral server executable", "Docker is not running"]
failure_lines = ['^error: .* (failed|timed out)', ': error: ', '^panic: ']
triage = { rerun = true, base = true }

# Proof that the tests a change adds or alters test the change: each is run on
# the code as it was at the unit's base, where it has to fail. Zig keeps a
# file's tests beside its code, so the tool splits the change at `test` blocks
# (see the tool). A test that passes at the base goes back to the builder;
# one that cannot be compiled or reached there is weaker proof, and the
# tester and the reviewer are told which those are.
[commands.test-proof]
argv = ["python3", "{config}/tools/temporal-sdk-zig/test-proof.py", "--base", "{base}", "--out", "{out}"]
timeout_secs = 3600
shown = "each test the change adds or alters, run on the code as it was at the base"
summary = "INDEX.txt"
fail_when = ['^PASSES-AT-BASE ']
note = """
INDEX.txt has one line for each test the change adds or alters, and for each test it removes. A tool ran each new test by name on the code as it was at the base: FAILS-AT-BASE is proof that the test tests the change. NO-BUILD-AT-BASE, NOT-RUN-AT-BASE, SKIPPED-AT-BASE and NOT-JUDGED are not proof: for those tests, and only those, whether they would fail without the change is still a question. REMOVED is a test the change takes away. runs.txt has the output of every run."""

# The project's own review tooling (.review/). --quick leaves the test suites
# out: the flow runs them as steps of their own, where a failure goes straight
# back to the builder.
[commands.reports]
argv = [".review/reports.sh", "--base", "{base}", "--out", "{out}", "--quick"]
timeout_secs = 1800
summary = "INDEX.txt"
# Results in the index that send the change back to the builder at once. The
# rest of the reports stays advisory: the vulnerability scanners can fail for
# reasons no bead caused, and the changelog check cannot pass on checkpoints.
fail_when = ['^FAILED:.*\b(ast-check|gitleaks)\b', '^zlint\s+[1-9][0-9]* error']
note = """
Read INDEX.txt first, then the files it points to: diff.patch, added-lines.txt, public-api-diff.txt, dependencies.txt, the scan-*.txt files and each scanner's log. A scan hit is a line to look at, not a finding: look at each one and decide.

Two lines of the index need care. Its changelog-check reads the factory's checkpoint commits, which carry no changelog trailer, so a failure there means only that the change adds no changelog fragment: judge for yourself whether it needs one. The factory runs the same check on the final commit before it pushes. And the test suites are not in these reports: the factory ran them, in Debug and ReleaseSafe, as steps of their own."""

[commands.samples-test]
argv = ["zig", "build", "samples-test", "--test-timeout", "10m"]
timeout_secs = 3600
could_not_run_when = ["invalid ephemeral server download", "failed to download ephemeral server executable", "Docker is not running"]
failure_lines = ['^error: .* (failed|timed out)', ': error: ', '^panic: ']
triage = { rerun = true, base = true }

[limits]
step_timeout_secs = 7200
step_budget_usd = 80.0
