# Factory-wide settings.
state_dir = "~/.local/state/software-factory"
claude_bin = "claude"
cli_version = "2.1.325"
allowed_models = ["claude-fable-5-2", "claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]

# launchd keeps the service running, as an agent of this user's desktop
# session (`factory service install`). `path` is where the service and the
# tools it starts are looked for, since launchd gives a job almost none.
[service]
label = "software-factory"
path = ["~/.local/bin", "/opt/homebrew/bin", "/opt/homebrew/sbin", "/usr/local/bin", "/usr/bin", "/bin", "/usr/sbin", "/sbin"]

# The Claude accounts workers run under. Capacity left in a window when it
# resets is lost, so each run uses the account whose week resets soonest, and
# between accounts whose weeks end together, the one whose five-hour session
# resets soonest. An account at a limit is left until its window resets; when
# all are at a limit the factory waits for the earliest reset. The windows are
# learned from every run. `usage_keychain` names a full login the factory may
# ask about an account's windows with, without a model call, when it has not
# heard from the account for half an hour. The first time such a login is
# used the factory notes whose it is, and it refuses one that later belongs
# to another account (`factory accounts pin <id>` accepts a deliberate change).
[[account]]
id = "claude"
# No token: the CLI's own login.
usage_keychain = "Claude Code-credentials"
# Claude Code keeps this login fresh only while it runs under it. When the
# factory works under another account for hours, nothing does, and the usage
# reads fail. So the factory refreshes it too, the way Claude Code does:
# under the lock Claude Code keeps in its configuration directory, and only
# if the login has not been refreshed meanwhile.
usage_refresh = true
usage_lock_dir = "~/.claude"

[[account]]
id = "claude2"
token_keychain = "claude2-oauth-token"
usage_keychain = "Claude Code-credentials-8351f113"
# This login exists only for reading usage and nothing else keeps it fresh,
# so the factory refreshes it when it is about to expire and writes it back
# to the same Keychain item.
usage_refresh = true

[slack]
# Holds SLACK_BOT_TOKEN and SLACK_OWNER_USER_ID. Readable by the owner only.
env_file = "~/.config/software-factory/slack.env"
poll_secs = 10
answer_wait_secs = 43200
