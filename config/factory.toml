# Factory-wide settings.
state_dir = "~/.local/state/software-factory"
claude_bin = "claude"
allowed_models = ["claude-fable-5-2", "claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]

# launchd keeps the service running, as an agent of this user's desktop
# session (`factory service install`). launchd gives a job almost no
# environment, so the service is started through this user's login shell
# (`login_shell`): it, and every agent and command it starts, then has the
# `PATH` and the rest of what the shell's profile sets up, as a terminal
# does. `path` is what that shell itself starts from.
[service]
label = "software-factory"
login_shell = true
path = ["~/.local/bin", "/opt/homebrew/bin", "/opt/homebrew/sbin", "/usr/local/bin", "/usr/bin", "/bin", "/usr/sbin", "/sbin"]

# The Temporal server the flow engine runs on (`factory-engine worker`): the
# owner's cluster, in a namespace of the factory's own. Nothing uses it yet
# but the engine's own command.
[temporal]
address = "http://192.168.101.240:7233"
namespace = "software-factory"
# Everything runs on the engine: each project's executive, directors and
# foremen take their turns in a workflow (`project-<id>`), their pipelines
# are workflows it starts, and `intake` listens to Slack and watches the
# pipelines. `factory serve` only becomes the engine's worker, which runs
# from `bin/factory-engine` under the state directory.
tiers = true
# What a supervisor inside the service does with its pipelines when
# `tiers` is taken out again: it runs them on the engine too.
pipelines = true

# The Claude accounts workers run under. Capacity left in a window when it
# resets is lost, so each run uses the account whose week resets soonest, and
# between accounts whose weeks end together, the one whose five-hour session
# resets soonest. An account at a limit is left until its window resets; when
# all are at a limit the factory waits for the earliest reset. The windows are
# learned from every run.
#
# Each account runs under a long-lived token (`claude setup-token`) kept in
# the owner's machine-config `.env`, under the names the owner's shell
# functions `claude` and `claude2` read. So an account is the same
# subscription for the factory as in the owner's shell, wherever the factory
# is started from, whether or not the Keychain is unlocked, and whoever is
# logged in to the CLI. A missing or empty token is an error, not the CLI's
# own login.
#
# A setup token cannot read usage. `usage_keychain` names a full login the
# factory may ask about an account's windows with, without a model call, when
# it has not heard from the account for half an hour. It is an extra: without
# it, or when it cannot be read, the windows come from runs alone. The first
# time such a login is used the factory notes whose it is, and it refuses one
# that later belongs to another account (`factory accounts pin <id>` accepts a
# deliberate change).
[[account]]
id = "claude"
token_env_file = "~/Source/machine-config/.env"
token_env = "CLAUDE_OAUTH_TOKEN"
# No usage login: the only full login of this account was the CLI's own,
# which is whichever account the owner last logged in as.

[[account]]
id = "claude2"
token_env_file = "~/Source/machine-config/.env"
token_env = "CLAUDE2_OAUTH_TOKEN"
usage_keychain = "Claude Code-credentials-8351f113"
# This login exists only for reading usage and nothing else keeps it fresh,
# so the factory refreshes it when it is about to expire and writes it back
# to the same Keychain item.
usage_refresh = true

[slack]
# Holds SLACK_BOT_TOKEN and SLACK_OWNER_USER_ID. Readable by the owner only.
env_file = "~/.config/software-factory/slack.env"
poll_secs = 10
answer_wait_secs = 43200
